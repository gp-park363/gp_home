{% extends "admin/base.html" %}
{% from "admin/_macros.html" import field_error %}
{% block content %}
<div class="mx-auto max-w-md">
  <h1 class="mb-4 text-xl font-bold text-ink">비밀번호 변경</h1>
  {% if done %}<p class="mb-4 rounded bg-emerald-50 px-3 py-2 text-sm text-emerald-800" role="status">비밀번호를 바꿨습니다. 다른 기기의 로그인은 해제되었습니다.</p>{% endif %}
  <form method="post" class="space-y-4 rounded-lg border border-gray-200 bg-white p-6">
    <div>
      <label for="current" class="block text-sm font-semibold text-ink">현재 비밀번호</label>
      <input id="current" name="current" type="password" required autocomplete="current-password" class="input mt-1.5">
      {{ field_error(errors.current) }}
    </div>
    <div>
      <label for="new" class="block text-sm font-semibold text-ink">새 비밀번호 <span class="font-normal text-gray-500">10자 이상, 문자와 숫자 섞어서</span></label>
      <input id="new" name="new" type="password" required minlength="10" autocomplete="new-password" class="input mt-1.5">
      {{ field_error(errors.new) }}
    </div>
    <div>
      <label for="confirm" class="block text-sm font-semibold text-ink">새 비밀번호 확인</label>
      <input id="confirm" name="confirm" type="password" required autocomplete="new-password" class="input mt-1.5">
    </div>
    <button class="btn-primary">변경</button>
  </form>
</div>
{% endblock %}
