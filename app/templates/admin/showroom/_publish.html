<button type="button" hx-post="/admin/showroom/{{ item.id }}/publish" hx-swap="outerHTML"
        class="rounded-full px-2.5 py-0.5 text-xs font-semibold {{ 'bg-emerald-100 text-emerald-800' if item.is_published else 'bg-gray-200 text-gray-600' }}"
        title="눌러서 {{ '숨기기' if item.is_published else '공개하기' }}">{{ "공개 중" if item.is_published else "숨김" }}</button>
