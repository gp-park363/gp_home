{% extends "admin/base.html" %}
{% block content %}
<div class="flex flex-wrap items-end justify-between gap-3">
  <h1 class="text-xl font-bold text-ink">견적 관리</h1>
</div>

{# 필터를 바꾸면 결과 영역(#results)만 교체하고 주소도 바꿉니다 #}
<form id="inq-filters" action="/admin/inquiries/" method="get"
      hx-get="/admin/inquiries/" hx-target="#results" hx-push-url="true"
      hx-trigger="change, submit, input changed delay:400ms from:#q"
      class="mt-4 grid grid-cols-2 gap-3 rounded-lg border border-gray-200 bg-white p-4 md:grid-cols-[1fr_10rem_9rem_9rem]">
  <div class="col-span-2 md:col-span-1">
    <label for="q" class="text-xs font-semibold text-gray-500">검색</label>
    <input id="q" name="q" type="search" value="{{ f.q }}" placeholder="접수번호, 제목, 업체명, 담당자명" class="input mt-1 py-2">
  </div>
  <div class="col-span-2 md:col-span-1">
    <label for="assignee" class="text-xs font-semibold text-gray-500">담당</label>
    <select id="assignee" name="assignee" class="input mt-1 py-2">
      <option value="">전체</option>
      <option value="me" {{ 'selected' if f.assignee == 'me' }}>내 담당</option>
      <option value="none" {{ 'selected' if f.assignee == 'none' }}>미지정</option>
      {% for s in staff %}<option value="{{ s.id }}" {{ 'selected' if f.assignee == s.id | string }}>{{ s.name }}</option>{% endfor %}
    </select>
  </div>
  <div>
    <label for="start" class="text-xs font-semibold text-gray-500">접수일 부터</label>
    <input id="start" name="start" type="date" value="{{ f.start or '' }}" class="input mt-1 py-2">
  </div>
  <div>
    <label for="end" class="text-xs font-semibold text-gray-500">까지</label>
    <input id="end" name="end" type="date" value="{{ f.end or '' }}" class="input mt-1 py-2">
  </div>
  <noscript><button class="btn-primary col-span-2">검색</button></noscript>
</form>

<div id="results" class="mt-4">
  {% include "admin/inquiries/_results.html" %}
</div>
{% endblock %}
