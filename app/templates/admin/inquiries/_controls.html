{# 상태·담당 변경. 바꾸면 처리 이력(#timeline)이 갱신되고, 이 카드도 OOB로 다시 그려집니다 #}
<section id="inq-controls" class="space-y-4 rounded-lg border border-gray-200 bg-white p-5"{% if oob %} hx-swap-oob="true"{% endif %}>
  <div>
    <label for="status" class="text-sm font-semibold text-ink">상태</label>
    <select id="status" name="status" class="input mt-1.5 py-2"
            hx-post="/admin/inquiries/{{ inq.id }}/status" hx-trigger="change" hx-target="#timeline">
      {% for key, label in statuses.items() %}<option value="{{ key }}" {{ 'selected' if inq.status == key }}>{{ label }}</option>{% endfor %}
    </select>
  </div>
  <div>
    <label for="assignee_id" class="text-sm font-semibold text-ink">담당</label>
    <select id="assignee_id" name="assignee_id" class="input mt-1.5 py-2"
            hx-post="/admin/inquiries/{{ inq.id }}/assignee" hx-trigger="change" hx-target="#timeline">
      <option value="">미지정</option>
      {% for s in staff %}<option value="{{ s.id }}" {{ 'selected' if inq.assignee_id == s.id }}>{{ s.name }}{{ " (나)" if s.id == user.id }}</option>{% endfor %}
    </select>
    {% if inq.assignee_id != user.id %}
      <button type="button" class="mt-1.5 text-sm text-brand hover:underline"
              hx-post="/admin/inquiries/{{ inq.id }}/assignee" hx-vals='{"assignee_id": "{{ user.id }}"}' hx-target="#timeline">내가 담당하기</button>
    {% endif %}
  </div>
</section>
