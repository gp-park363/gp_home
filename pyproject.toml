[project]
name = "goodpackage"
version = "0.1.0"
description = "좋은상자(goodpackage.co.kr) 홈페이지 — FastAPI + htmx"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.163",
    "uvicorn[standard]>=0.54",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "pydantic-settings>=2.10",
    "sqlalchemy>=2.1",
    "psycopg[binary]>=3.3",
    "alembic>=1.20",
    "argon2-cffi>=25.1",
    "itsdangerous>=2.2",
    "pillow>=12",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.1",
    "pytest>=8.4",
    "ruff>=0.14",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py315"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
