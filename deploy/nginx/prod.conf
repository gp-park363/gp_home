# 운영용: Cloudflare(Full strict) → 443, Origin 인증서 사용
# 방문자 IP는 CF-Connecting-IP로 복원 (cloudflare-ips.conf)
include /etc/nginx/snippets/cloudflare-ips.conf;

map $http_x_forwarded_proto $forwarded_proto {
    default https;
}

server_tokens off;

# 도메인 외 Host 요청(IP 직접 접속 등)은 응답하지 않음
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}

server {
    listen 80;
    server_name goodpackage.co.kr www.goodpackage.co.kr new.goodpackage.co.kr localhost;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name goodpackage.co.kr www.goodpackage.co.kr new.goodpackage.co.kr localhost;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/snippets/locations.conf;
}
