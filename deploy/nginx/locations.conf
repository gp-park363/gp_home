# 로컬·운영 공통 location 규칙 (server 블록 안에서 include)

# 첨부 5개 × 9MB = 45MB + 폼 필드 여유
client_max_body_size 50m;

location /static/ {
    alias /srv/static/;
    expires 30d;
    add_header Cache-Control "public, immutable";
    access_log off;
}

# 쇼룸·페이지 이미지 (공개)
location /media/ {
    alias /data/media/public/;
    expires 30d;
    add_header Cache-Control "public";
    access_log off;
}

# 견적 첨부 (비공개): 외부에서 직접 접근 불가.
# FastAPI가 권한 확인 후 X-Accel-Redirect: /_private/<경로> 로 넘겨줍니다.
location /_private/ {
    internal;
    alias /data/media/private/;
}

location / {
    proxy_pass http://web:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;  # 포트 포함 (리다이렉트 Location이 :8080을 유지)
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_read_timeout 60s;
}
